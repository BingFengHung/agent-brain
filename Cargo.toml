[package]
name = "agent-brain"
version = "0.1.5"
edition = "2021"
authors = ["BingFengHung <your.email@example.com>"]
description = "Long-Term Memory & Smart Resume Gateway Agent CLI for Copilot CLI, agy & AI Agents."
repository = "https://github.com/BingFengHung/agent-brain"
readme = "README.md"
keywords = ["ai", "agent", "memory", "cli", "copilot"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
inquire = "0.7"
anyhow = "1.0"
async-trait = "0.1"
self-replace = "1.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tempfile = "3.10"

[dev-dependencies]
